# Recipe 2 settings. Any of these can be overridden from the command line:
#   python3 train.py --config config.yaml --set micro_batch=16 --set ckpt_dir=/staging/<user>/run1/checkpoints

# --- data (made by prepare_data.py: shards + manifest.json) ---
data_dir: "."            # the directory with manifest.json; job.sub points it at /staging

# --- model: GPT-2 small, 124M parameters ---
vocab_size: 50304        # GPT-2's 50257 tokens, padded to a multiple of 64
block_size: 1024         # context length
n_layer: 12
n_head: 12
n_embd: 768
dropout: 0.0             # one pass over 10B tokens: no dropout

# --- training ---
num_passes: 1            # passes over the data (each with its own shard order); 1 is usual for pretraining
total_batch_tokens: 524288   # tokens per optimizer step (2**19, as GPT-2), whatever the GPU count
micro_batch: 32          # sequences per GPU per forward/backward: lower it if the GPU runs out of memory.
                         # Gradient accumulation makes up the rest: 4 GPUs x 32 x 1024 = 128k tokens, x 4 = 512k
lr: 0.0006
min_lr: 0.00006
warmup_steps: 700
weight_decay: 0.1
grad_clip: 1.0
seed: 1337
compile: true            # torch.compile: faster steps, but adds start-up time to every restart
deterministic: false

# --- evaluation and logging ---
eval_every_steps: 250
eval_sequences: 512      # validation loss on the same 512 x 1024 tokens every time, whatever the GPU count
log_every: 10

# --- checkpointing ---
ckpt_dir: checkpoints    # resumable checkpoints (job.sub puts them on /staging)
out_dir: outputs         # what you keep: best model, metrics log
keep_checkpoints: 2      # on /staging: a fallback if the newest is damaged
max_runtime_seconds: 3600    # the timed checkpoint: save and exit 85 every hour.
                             # A DEMONSTRATION value, so the full run (~3.7 h on 4 A100s, less on faster
                             # GPUs) restarts several times. For real runs CHTC suggests 6-10 h on backfill
                             # and 4-6 h (up to 8) on the OSPool: a vacate gets its own save anyway.
save_every_minutes: 30   # extra in-place saves without exiting: on /staging they're durable at once.
                         # Set 0 in spool mode (job_spool.sub), where the timed exit is the periodic save.

# --- optional ---
wandb: false             # log to Weights & Biases (needs network and an API key); resumes the same W&B run
wandb_project: gpt2-fineweb-checkpointing
collective_timeout_seconds: 300  # a rank waiting this long for the others aborts the job (NCCL's default: 600)
step_delay: 0.0          # seconds to sleep per step: only for tests that need a slow job
save_delay: 0.0          # seconds added to every save: only for the slow-save test (test_local.py --ddp)
max_steps: 0             # stop (as if finished) after this many steps; 0 = the whole run. For tests and smoke runs
